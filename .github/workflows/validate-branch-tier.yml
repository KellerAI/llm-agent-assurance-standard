name: Validate branch tier

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

# Enforces the 4-tier merge model:
#   main  <- qa/**  only
#   qa    <- dev/** only
#   dev   <- external/** (contributors), a CODEOWNER branch, or an author
#            listed in .github/tier-allowed-authors.txt (code-owned file)
# external/* naming is validated separately by validate-branch-name.yml.
jobs:
  validate-branch-tier:
    # Fixed name: rulesets require this exact context (no expressions).
    name: Branch tier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tier rule
        run: |
          python3 - <<'PYEOF'
          import re, sys, os

          base = os.environ["BASE_REF"]   # target branch (e.g. main)
          head = os.environ["HEAD_REF"]   # source branch (e.g. qa/something)
          actor = os.environ["ACTOR"]     # PR author GitHub login

          # Read .github/CODEOWNERS to determine if the author is a maintainer.
          codeowners = set()
          try:
              with open(".github/CODEOWNERS") as f:
                  for line in f:
                      line = line.strip()
                      if not line or line.startswith("#"):
                          continue
                      for token in line.split():
                          if token.startswith("@"):
                              codeowners.add(token.lstrip("@").lower())
          except FileNotFoundError:
              pass

          is_maintainer = actor.lower() in codeowners

          # Read .github/tier-allowed-authors.txt: non-CODEOWNER PR authors allowed
          # into dev. The file sits under /.github/, so CODEOWNERS review guards it.
          ALLOWLIST = ".github/tier-allowed-authors.txt"
          allowed = {}  # lowercase login -> (line number, login as written)
          try:
              with open(ALLOWLIST) as f:
                  for lineno, line in enumerate(f, start=1):
                      entry = line.split("#", 1)[0].strip()
                      if not entry:
                          continue
                      login = entry.split()[0].lstrip("@")
                      allowed.setdefault(login.lower(), (lineno, login))
          except FileNotFoundError:
              pass

          # Tier rules: maps target branch to (allowed-source-pattern, error-message).
          RULES = {
              "main": (r"^qa(/.*)?$",    "PRs into main must come from qa/**"),
              "qa":   (r"^dev(/.*)?$",   "PRs into qa must come from dev/**"),
              "dev":  (r"^(external/|dependabot/)",    "PRs into dev must come from external/**, dependabot/**, a CODEOWNER, or an author in .github/tier-allowed-authors.txt"),
          }

          if base not in RULES:
              # No tier rule for this target — allow (e.g. PRs between feature branches).
              print(f"No tier rule for base '{base}'; skipping.")
              sys.exit(0)

          pattern, message = RULES[base]

          if re.match(pattern, head):
              print(f"Tier check passed: {head} -> {base}")
              sys.exit(0)

          if base == "dev" and is_maintainer:
              print(f"Tier check passed: CODEOWNER '{actor}' may merge directly into dev.")
              sys.exit(0)

          if base == "dev" and actor.lower() in allowed:
              lineno, login = allowed[actor.lower()]
              print(f"tier: dev allowed via {ALLOWLIST}:{lineno} ({login})")
              sys.exit(0)

          print(f"::error::{message}")
          print(f"::error::Attempted: {head} -> {base}")
          sys.exit(1)
          PYEOF
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.event.pull_request.user.login }}
