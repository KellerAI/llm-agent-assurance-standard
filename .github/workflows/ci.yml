name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JSON well-formedness
        run: |
          status=0
          while IFS= read -r f; do
            if ! jq empty "$f" >/dev/null 2>&1; then
              echo "::error file=$f::invalid JSON"
              status=1
            fi
          done < <(find . -type f -name '*.json' \
            -not -path './.git/*' -not -path './node_modules/*')
          exit $status

      - name: Markdown lint
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Sanitization gate
        run: bash scripts/check-sanitization.sh

  conformance:
    uses: KellerAI/kellerai-oss-template/.github/workflows/conformance.yml@8c0f533df8d19f1ebbb560b31021436c05ff537d
    with:
      artifact_type: "rego-policy"

  links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: "--no-progress --exclude KellerAI/llm-agent-assurance-standard --exclude electropedia.org --exclude iso.org --exclude kellerai.blog ."
          fail: true
