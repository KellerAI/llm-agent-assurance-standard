name: Commit lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    # Promotion PRs (dev -> qa, qa -> main) re-lint commits already linted on
    # their way into dev, plus GitHub-generated squash bodies; skip them.
    if: ${{ !((github.base_ref == 'qa' && github.head_ref == 'dev') || (github.base_ref == 'main' && github.head_ref == 'qa')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate pull request commit messages
        run: |
          npx --yes \
            --package @commitlint/cli \
            --package @commitlint/config-conventional \
            commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
