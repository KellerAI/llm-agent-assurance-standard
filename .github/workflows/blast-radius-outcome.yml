# Blast-radius outcome — appends the committed trace line to
# audit/blast-radius.jsonl after every successful gate run.
#
# Triggered by `workflow_run` of "Blast-radius pulse" (the gate). The
# write-back uses contents:write and commits with a [skip ci] marker; the
# gate workflow itself never has contents:write (least-privilege gate).
#
# Where the trail lives: the `audit-trail` branch, file audit/blast-radius.jsonl.
# main, qa and dev are ruleset-protected ("Changes must be made through a pull
# request"), and github-actions is not a bypass actor, so a direct push there
# is rejected with GH013. audit-trail is outside every ruleset. It is created
# once by hand; this workflow never creates it and fails with an error if it
# is missing. Every write is a fast-forward append. The audit/ copy on
# main/dev/qa is the frozen pre-split history and is no longer appended to.
#
# workflow_run always runs the copy of this file on the default branch (main),
# so a change here takes effect only once it reaches main.
#
# Recursion-break guards (ADR-002 §5):
#   1. The gate workflow declares paths-ignore: ['audit/**'].
#   2. Every commit this workflow writes ends with [skip ci].
#   3. Author-identity guard at the head of the job exits early if the
#      triggering commit is itself a github-actions[bot] audit/** commit.
name: Blast-radius outcome

on:
  workflow_run:
    workflows: ["Blast-radius pulse"]
    types: [completed]

permissions:
  contents: write        # commit trace line
  pull-requests: read    # resolve PR metadata

concurrency:
  group: blast-radius-trace
  cancel-in-progress: false

jobs:
  outcome:
    name: Append blast-radius trace
    # Run only on pull_request-triggered gate completions AND only when the
    # gate-triggering actor is not github-actions[bot]. The latter is the
    # author-identity recursion guard (3 of 3 per ADR-002 §5): if the gate
    # run was authored by the bot, the trace write-back is suppressed.
    if: >-
      ${{ github.event.workflow_run.event == 'pull_request'
          && github.event.workflow_run.actor.login != 'github-actions[bot]'
          && github.event.workflow_run.actor.login != 'blast-radius-bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (default branch HEAD)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download gate trace artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: blast-radius-pulse-${{ github.event.workflow_run.id }}
          path: .pulse-in
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Append trace line on the audit-trail branch
        env:
          AUDIT_BRANCH: audit-trail
          PR_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ ! -f .pulse-in/trace-fragment.jsonl ]; then
            echo "no trace fragment in artifact — nothing to append"
            exit 0
          fi
          git config user.name "blast-radius-bot"
          git config user.email "blast-radius-bot@users.noreply.github.com"
          frag="$(pwd)/.pulse-in/trace-fragment.jsonl"
          # The writers never create the branch: two writers creating it from
          # different commits would race. It is created once, by hand.
          set +e
          git ls-remote --exit-code --heads origin "${AUDIT_BRANCH}" >/dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::branch '${AUDIT_BRANCH}' does not exist on origin. It must be created once by hand (a maintainer task) before this workflow can write the audit trail."
            exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::git ls-remote for '${AUDIT_BRANCH}' failed (exit ${rc})"
            exit 1
          fi
          # Append-only writer. Fast-forward pushes only (never --force), so a
          # race with the trust-dial writer is retried on a fresh base.
          for attempt in 1 2 3 4 5; do
            rm -rf .audit && git worktree prune
            git fetch --no-tags origin "+refs/heads/${AUDIT_BRANCH}:refs/remotes/origin/${AUDIT_BRANCH}"
            git worktree add --detach .audit "origin/${AUDIT_BRANCH}"
            log=.audit/audit/blast-radius.jsonl
            mkdir -p .audit/audit
            # Ensure newline termination on the existing trace before append.
            if [ -s "$log" ] && [ -n "$(tail -c1 "$log")" ]; then
              printf '\n' >> "$log"
            fi
            cat "$frag" >> "$log"
            git -C .audit add audit/blast-radius.jsonl
            git -C .audit commit -q -m "chore(blast-radius): append pulse trace for run ${PR_RUN_ID} [skip ci]"
            if git -C .audit push origin "HEAD:refs/heads/${AUDIT_BRANCH}"; then
              echo "appended to ${AUDIT_BRANCH}: $(git -C .audit rev-parse HEAD)"
              echo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/$(git -C .audit rev-parse HEAD)/audit/blast-radius.jsonl" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); retrying on a fresh base"
            sleep $((attempt * 3))
          done
          echo "::error::could not append to ${AUDIT_BRANCH} after 5 attempts"
          exit 1
